title = "SessionManager branch-scoped fork (forkFrom sourceLeafId + forkBranch)"
behavior = "SessionManager branch-scoped fork (forkFrom sourceLeafId + forkBranch): `SessionManager.forkFrom` (packages/coding-agent/src/session/session-manager.ts) accepts `sourceLeafId` in its options: when present it walks parents from that leaf and clones only that branch (rejecting an explicit `undefined` with \"Fork source leaf is unavailable\", a missing entry, and a parent cycle), when `null` it produces a header-only session with no history, and the clone keeps `parentSession` plus the source `providerPromptCacheKey` under a new session id while leaving the source file untouched. `SessionManager#forkBranch(options)` flushes the current transcript (or drains storage) and delegates to `forkFrom` with the same storage, throwing \"Cannot fork a session without a persisted transcript\" when there is no file."
