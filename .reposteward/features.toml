decision = "keep"
evidence = {commits = ["173d7abe54d80565dc96c4c6c47ff740018cd46b"], patch_ids = ["da2799f076b21ee8cfc1f1f52cf369796eb6a3b1"], paths = ["packages/coding-agent/src/modes/components/fullscreen-chat-layout.ts"]}
