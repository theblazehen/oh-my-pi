[[feature]]
id = "fullscreen-chat-viewport-pinned-chrome"
title = "Fullscreen chat viewport: pinned chrome, follow, scroll, bounded rows"
behavior = "Fullscreen chat viewport: pinned chrome, follow, scroll, bounded rows: `FullscreenChatLayout` (packages/coding-agent/src/modes/components/fullscreen-chat-layout.ts) is a fullscreen chat viewport: it renders exactly `getTerminalRows()` physical lines, pins `beforeEditor` rows + the editor host at the bottom, and scrolls only the transcript. Follow-bottom is on by default; scrolling up detaches follow so appended content does not move the window, and Ctrl+End (`\\x1b[8^`) re-arms follow. Retained transcript rows are bounded by `maxTranscriptRows` (head dropped) while a scrolled view keeps its absolute position. `FullscreenTranscriptAggregate` re-concatenates its children on every render so rows appended to a persistent child array reference are visible."
