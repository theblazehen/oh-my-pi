[[feature]]
id = "fullscreen-overlay-keeps-the-focused"
title = "Fullscreen overlay keeps the focused component's hardware cursor (+1)"
behavior = "Fullscreen overlay keeps the focused component's hardware cursor: A focused fullscreen overlay component that renders the cursor marker gets a visible hardware cursor at the marker's cell: after the frame settles the terminal cursor position equals the marker's row/column (e.g. row 7, col 10 in a 40x8 virtual terminal). Previously the alternate-screen path discarded focused cursor markers, leaving editors with no visible cursor.; Fullscreen image budget, byte-exact image rows, and settle repaint: Fullscreen paint fidelity in packages/tui: terminal image rows are indivisible protocol payloads, so both the fullscreen overlay compositor (`TUI`) and `ScrollView` pass them through byte-exact instead of splicing resets/padding/scrollbar suffixes; fullscreen component rendering is bracketed by `imageBudget.beginPass()`/`endPass()`; and a render requested during the post-full-paint settle timer is repainted when the settle elapses even if no further input arrives."
