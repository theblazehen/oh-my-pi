behavior = "Per-overlay SGR mouse tracking modes (drag vs motion) and teardown: Mouse reporting is scoped to the topmost fullscreen overlay and tracks an exact mode: `mouseTracking: \"drag\"` enables ESC[?1002h + ESC[?1006h (press/drag/release, native selection off), `\"motion\"` enables ESC[?1003h + ESC[?1006h, `true` = the legacy motion default, `false` disables reporting. Changing the topmost overlay rewrites the exact modes without re-entering the alternate screen, and teardown (overlay hide, `stop()`, `emergencyTerminalRestore`) writes ESC[?1006l ESC[?1003l ESC[?1002l (no longer ESC[?1000l) before leaving the alternate screen."
