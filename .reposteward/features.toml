[[feature]]
id = "sgr-mouse-decoding-button-identity-and"
title = "SGR mouse decoding: button identity and modifier state"
behavior = "SGR mouse decoding: button identity and modifier state: Decoded SGR mouse events carry physical button identity and modifier state: `SgrMouseEvent.buttonId` is 0/1/2 (or null for wheel and no-button motion), `shift`/`alt`/`ctrl` decode from bits 4/8/16 independently of button and motion bits, and `leftClick` is true only for a non-release, non-motion, non-wheel report with buttonId 0 — so a left press keeps buttonId 0 while the drag and release reports are not clicks."
why = {text = "inferred from the fork's commits: snapshot", source = "inferred"}
decision = "keep"
